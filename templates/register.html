{% extends 'base.html' %}{% block title %}Kayıt Ol | Rezervia{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card wide"><span class="eyebrow">YENİ HESAP</span><h1>Rezervia'ya katılın</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label>Ad<input class="form-control" name="first_name" required></label></div><div class="col-md-6"><label>Soyad<input class="form-control" name="last_name" required></label></div><div class="col-md-6"><label>Kullanıcı adı<input class="form-control" name="username" required></label></div><div class="col-md-6"><label>E-posta<input class="form-control" type="email" name="email" required></label></div><div class="col-md-6"><label>Telefon<input class="form-control" name="phone" required></label></div><div class="col-md-6"><label>Şifre<input class="form-control" type="password" name="password" required minlength="6"></label></div><div class="col-md-6"><label>Şifre tekrar<input class="form-control" type="password" name="password_confirm" required></label></div></div><button class="btn btn-primary w-100 mt-4">Hesap Oluştur</button></form><p class="text-center mt-4 mb-0">Zaten hesabınız var mı? <a href="{{ url_for('login') }}">Giriş yapın</a></p></div></div>{% endblock %}
